<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/src/styles/fonts.css">
<style>
html,body{margin:0;background:#f2e6cf}
#og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Chillax',sans-serif;color:#12303a}
canvas{position:absolute;inset:0;width:100%;height:100%}
.t{position:absolute;left:72px;top:64px;display:flex;flex-direction:column;gap:0}
.mark{font-family:'Erode',serif;font-weight:600;font-size:46px;letter-spacing:-.1em;line-height:1;display:flex;align-items:baseline;margin-bottom:18px}
.mark b{font-weight:inherit;color:#ef9f5c}.mark span{display:inline-block;transform:rotate(-8deg) translateY(.06em)}
.name{font-family:'Erode',serif;font-weight:600;font-size:104px;line-height:.94;letter-spacing:-.025em}
.rule{width:520px;height:1px;background:linear-gradient(90deg,rgba(18,48,58,.6),transparent);margin:22px 0 16px}
.role{font-family:'Sono',monospace;font-size:18px;letter-spacing:.14em;text-transform:uppercase}
.tag{font-family:'Erode',serif;font-style:italic;font-size:22px;color:rgba(18,48,58,.75);margin-top:10px}
.url{position:absolute;left:72px;bottom:44px;font-family:'Sono',monospace;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,230,207,.85)}
</style></head><body>
<div id="og"><canvas id="c" width="1200" height="630"></canvas>
<div class="t"><div class="mark"><b>S</b><span>Y</span></div><div class="name">Shourya<br>Yadav</div><div class="rule"></div><div class="role">JRA @ M3 · Software Lead @ ACM</div><div class="tag">a portfolio, shaped like an operating system</div></div>
</div>
<script type="module">
import { landingScene } from '../src/wallpapers/index.js'
const c = document.getElementById('c'), ctx = c.getContext('2d')
const S = landingScene.init(1200, 630, 21)
// place the sun to the right, clear of the type; hills stay
S.sunX = 940; S.sunY = 300
const sh = { t: 1.7, dt: .016, w: 1200, h: 630, intro: { active: false }, outro: null, pointer: { inside: false }, ripples: [], pulses: [], slow: true, masks: [{ x: 40, y: 40, w: 760, h: 420 }] }
landingScene.frame(ctx, 1200, 630, sh, S)
await document.fonts.ready; window.__ready = true
</script></body></html>
